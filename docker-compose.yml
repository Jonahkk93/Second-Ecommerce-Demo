services:
  postgres:
    build:
      context: .
      dockerfile: apps/api/postgres.Dockerfile
    environment:
      POSTGRES_DB: mpwr
      POSTGRES_USER: mpwr
      POSTGRES_PASSWORD: mpwr_local
    ports: ["5432:5432"]
    volumes:
      - mpwr_postgres:/var/lib/postgresql/data
      - ./apps/api/drizzle/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpwr -d mpwr"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["mpwr_redis:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "node apps/api/scripts/migrate-production.mjs && npm --workspace apps/api run start"]
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      WEB_ORIGIN: http://127.0.0.1:5501
      DATABASE_URL: postgresql://mpwr:mpwr_local@postgres:5432/mpwr
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-change-before-production
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      PESAPAL_ENV: sandbox
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
      PESAPAL_CALLBACK_URL: http://127.0.0.1:5501/payment-complete.html
      PESAPAL_CANCELLATION_URL: http://127.0.0.1:5501/checkout.html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  mpwr_postgres:
  mpwr_redis:
