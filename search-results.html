<!DOCTYPE html>
<html lang="en" class="site-loading-enabled">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>Search results | MPWR</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/CARTNEW.css?v=20260808-3">
    <link rel="stylesheet" href="css/search-results.css?v=20260809-20">
    <link rel="stylesheet" href="css/loading-states.css?v=20260809-23">
    <script src="js/loading-states.js?v=20260809-23" defer></script>
    <script src="js/products.js" defer></script>
    <script type="module" src="js/search-results.js?v=20260809-23"></script>
    </head>
<body>
    <header class="results-header">
        <div class="results-nav-row">
            <button class="product-back-btn" type="button" aria-label="Back to search">
                <img src="images/optimized/back.png" alt="Back">
            </button>
            <form class="results-search" role="search">
                <img src="images/Search icon black .png" alt="">
                <input id="results-query" type="search" aria-label="Search products" autocomplete="off">
                <button class="query-clear" type="button" aria-label="Clear search"><img src="images/optimized/close-icon.png" alt=""></button>
            </form>
            <div id="wishlist-nav-icon">
                <img src="images/optimized/heart-nav.png" class="wishlist-nav-image">
            </div>
            <div id="cart-icon">
                <img src="images/Cart black.png" class="cart-image">
                <span class="cart-item-count"></span>
            </div>
        </div>
        <section class="results-toolbar" aria-label="Sort and filter products" aria-busy="true">
            <div class="filter-loading" role="status" aria-label="Loading product filters">
                <span class="site-content-loading"></span>
                <span class="site-content-loading"></span>
                <span class="site-content-loading"></span>
                <span class="site-content-loading"></span>
            </div>
            <select id="sort-results" aria-label="Sort results">
                <option value="relevance" data-trigger-label="Sort by">Most relevant</option>
                <option value="popular">Most popular</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
            </select>
            <select id="color-filter" aria-label="Filter by color"><option value="" data-trigger-label="Color">All colors</option></select>
            <select id="size-filter" aria-label="Filter by size"><option value="" data-trigger-label="Size / length">All sizes / lengths</option></select>
            <button class="reset-filters" type="button">Clear filters</button>
        </section>
    </header>

    <div class="results-cart-backdrop" aria-hidden="true"></div>
    <div class="results-wishlist-backdrop" aria-hidden="true"></div>

    <div class="product-modal-overlay">
        <div class="product-modal">
            <div class="product-modal-top">
                <div class="product-modal-left">
                    <a class="product-modal-image-link" href="product.html" aria-label="View product details">
                        <img src="" class="product-modal-image" alt="">
                    </a>
                </div>
                <div class="product-modal-right">
                    <div class="product-modal-header">
                        <a class="product-modal-title-link" href="product.html">
                            <h2 class="product-modal-title"></h2>
                        </a>
                    </div>
                    <span class="product-modal-price"></span>
                    <button type="button" class="product-modal-favorite">Add To Favorites</button>
                    <div class="product-modal-description-row">
                        <p class="product-modal-description">Product description coming soon...</p>
                        <a class="product-modal-read-more" href="product.html">Read more</a>
                    </div>
                </div>
            </div>
            <div class="product-modal-options-group">
                <div class="product-modal-options-dynamic"></div>
            </div>
            <button class="product-modal-cart" type="button">Add to Cart</button>
        </div>
    </div>

    <main class="results-main">
        <div class="results-grid product-content"></div>
        <section class="no-results" hidden><h2>No products found</h2><p>Try a different search or clear the filters.</p></section>
    </main>
</body>
</html>
