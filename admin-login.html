<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/password-toggle.css">
</head>
<body class="admin-login-page">
    <main class="admin-login">
        <section class="admin-login-intro">
            <a href="index.html" class="admin-login-logo">MPWR</a>
            <div>
                <p class="admin-login-kicker">Administration</p>
                <h1>Welcome MPWR Admin</h1>
                <p>Lets Get To Work</p>
            </div>
        </section>

        <form class="admin-login-card" id="admin-login-form">
            <div class="admin-login-brand">MPWR</div>
            <p class="admin-login-portal">Admin Portal</p>


            <label for="admin-email">Email address</label>
            <input type="email" id="admin-email" autocomplete="username" required autofocus>

            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" autocomplete="current-password" required>

            <p class="admin-login-error" id="admin-login-error" role="alert"></p>
            <button type="submit" id="admin-login-button">Log In</button>
            <p class="admin-login-secure">
                <img src="images/Icon Folder/Padlock Icon_E5A484.PNG" alt="">
                Secure administrator access
            </p>
        </form>
    </main>

    <script type="module" src="js/admin-login.js"></script>
    <script src="js/password-toggle.js"></script>
</body>
</html>
