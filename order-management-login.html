<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPWR Orders Login</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/admin.css?v=20260908-4">
    <link rel="stylesheet" href="css/order-management.css?v=20260909-1">
</head>
<body class="admin-login-page orders-login-page">
    <main class="admin-login">
        <form class="admin-login-card" id="orders-login-form">
            <div class="admin-login-brand">MPWR</div>
            <p class="admin-login-portal">Orders Portal</p>
            <h1>Staff Login</h1>
            <label for="orders-email">Email address</label>
            <input type="email" id="orders-email" autocomplete="username" required autofocus>
            <label for="orders-password">Password</label>
            <input type="password" id="orders-password" autocomplete="current-password" required>
            <p class="admin-login-error" id="orders-login-error" role="alert"></p>
            <button type="submit" id="orders-login-button">Log In</button>
            <p class="admin-login-secure">Secure orders-only access</p>
        </form>
    </main>
    <script type="module" src="js/order-management-login.js?v=20260909-1"></script>
</body>
</html>
