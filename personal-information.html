<!DOCTYPE html>
<html lang="en" class="site-loading-enabled">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Personal Information | MPWR</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/account.css?v=20260816-22">
    <link rel="stylesheet" href="css/touch-interactions.css">
    <link rel="stylesheet" href="css/loading-states.css?v=20260809-23">
    <script src="js/loading-states.js?v=20260809-23" defer></script>
    <script src="js/touch-interactions.js" defer></script>
</head>
<body>
    <header class="account-page-header">
        <a href="Account.html" class="account-back" aria-label="Back to profile"></a>
        <a href="index.html" class="account-logo">MPWR</a>
        <span></span>
    </header>

    <main class="personal-information-page" id="personal-information-page" hidden>
        <header class="personal-information-heading">
            <p class="account-kicker personal-information-kicker"><img src="images/Icon Folder/Profile Icon_E5A484.PNG" alt=""><span>My Profile</span></p>
        </header>

        <form class="personal-information-card" id="personal-information-form">
            <div class="personal-photo-editor">
                <label class="personal-photo-control" for="personal-profile-file" aria-label="Change profile picture">
                    <img id="personal-profile-image" alt="Profile picture">
                    <span>Change</span>
                    <input id="personal-profile-file" type="file" accept="image/*" hidden>
                </label>
                <small>JPG, PNG or WebP. Maximum 5 MB.</small>
            </div>

            <div class="personal-fields-grid">
                <label>First name
                    <input id="personal-first-name" type="text" autocomplete="given-name" required>
                </label>
                <label>Last name
                    <input id="personal-last-name" type="text" autocomplete="family-name" required>
                </label>
            </div>

            <label>Email address
                <input id="personal-email" type="email" autocomplete="email" required>
            </label>

            <p class="personal-information-message" id="personal-information-message" role="status"></p>
            <button type="submit" id="personal-information-save">Save Changes</button>
        </form>
    </main>

    <div class="account-loading" id="personal-information-loading">Loading your profile…</div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/personal-information.js"></script>
</body>
</html>
