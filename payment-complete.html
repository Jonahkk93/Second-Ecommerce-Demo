<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order received | MPWR</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/checkout.css?v=20260925-1">
    <link rel="stylesheet" href="css/payment-complete.css?v=20260924-2">
</head>
<body>
    <header class="checkout-header">
        <a class="back-link" href="index.html" aria-label="Back to MPWR"></a>
        <a class="brand" href="index.html">MPWR</a>
        <span class="secure-label">Secure checkout</span>
    </header>
    <main class="checkout-shell payment-complete-shell">
        <section class="order-success payment-result" aria-live="polite" aria-busy="true">
            <div class="success-mark payment-result-mark" aria-hidden="true"><span></span></div>
            <div class="eyebrow payment-result-kicker" id="payment-result-kicker">Secure checkout</div>
            <h1 id="payment-result-title">Confirming your payment</h1>
            <p id="payment-result-message">Please keep this page open while we verify the result with the payment provider.</p>
            <p class="payment-result-reference" id="payment-result-reference"></p>
            <div class="success-actions payment-result-actions" id="payment-result-actions" hidden>
                <a href="orders.html">View my orders</a>
                <a class="secondary" href="index.html">Continue shopping</a>
            </div>
        </section>
    </main>
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/payment-complete.js?v=20260924-2"></script>
</body>
</html>
