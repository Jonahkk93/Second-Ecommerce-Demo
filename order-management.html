<!DOCTYPE html>
<html lang="en" class="site-loading-enabled">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPWR Orders Portal</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/admin.css?v=20260908-4">
    <link rel="stylesheet" href="css/order-management.css?v=20260909-1">
    <link rel="stylesheet" href="css/loading-states.css?v=20260809-23">
    <script src="js/loading-states.js?v=20260809-23" defer></script>
</head>
<body data-orders-portal="true">
    <div class="admin-dashboard orders-portal" id="admin-dashboard" hidden>
        <nav class="admin-nav orders-portal-nav" aria-label="Orders portal navigation">
            <a class="admin-nav-brand" href="order-management.html">MPWR</a>
            <span class="admin-nav-section">Orders Portal</span>
            <div class="admin-account">
                <button class="admin-account-button" id="admin-account-button" type="button" aria-label="Orders account" aria-expanded="false">
                    <img class="admin-account-photo" id="admin-account-photo" alt="">
                    <span class="admin-account-initials" id="admin-account-initials" aria-hidden="true"></span>
                </button>
                <div class="admin-account-menu" id="admin-account-menu" hidden>
                    <p class="admin-account-label">Orders staff</p>
                    <p class="admin-account-email" id="admin-account-email"></p>
                    <button type="button" id="admin-signout">Sign Out</button>
                </div>
            </div>
        </nav>

        <header class="admin-header orders-portal-header">
            <p class="orders-portal-kicker">Fulfilment workspace</p>
            <h1>Orders</h1>
            <div class="dashboard-stats">
                <div class="stat-card"><h3>Total Orders</h3><p id="total-orders">...</p></div>
                <div class="stat-card"><h3>Pending Orders</h3><p id="pending-orders">...</p></div>
                <div class="stat-card"><h3>Total Revenue</h3><p id="total-revenue">Loading...</p></div>
                <div class="stat-card"><h3>Total Customers</h3><p id="total-customers">...</p></div>
            </div>
        </header>

        <main class="admin-container" id="orders">
            <div class="orders-portal-heading"><div><p>Order management</p><h2>All orders</h2></div></div>
            <div class="admin-toolbar">
                <input type="text" id="order-search" placeholder="Search by Order ID or Customer...">
                <div class="status-filters">
                    <button class="filter-btn active" data-status="All">All</button>
                    <button class="filter-btn" data-status="Pending">Pending</button>
                    <button class="filter-btn" data-status="Processing">Processing</button>
                    <button class="filter-btn" data-status="Shipped">Shipped</button>
                    <button class="filter-btn" data-status="Delivered">Delivered</button>
                    <button class="filter-btn" data-status="Cancelled">Cancelled</button>
                </div>
            </div>
            <div class="orders-list"></div>
            <div class="admin-status-confirm" id="admin-status-confirm" hidden>
                <div class="admin-status-confirm-box" role="dialog" aria-modal="true" aria-labelledby="admin-status-confirm-title">
                    <h2 id="admin-status-confirm-title">Update Order Status?</h2>
                    <p>Are you sure you want to update this order to <strong id="admin-status-confirm-name"></strong>?</p>
                    <div class="admin-status-confirm-actions"><button type="button" class="admin-status-cancel">Cancel</button><button type="button" class="admin-status-approve">Update Status</button></div>
                </div>
            </div>
            <div id="admin-toast"></div>
        </main>
    </div>
    <script type="module" src="js/products.js"></script>
    <script type="module" src="js/admin.js?v=20260909-5"></script>
</body>
</html>
