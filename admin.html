<!DOCTYPE html>
<html lang="en" class="site-loading-enabled">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no,email=no,address=no,date=no">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/signout-confirm.css">
    <link rel="stylesheet" href="css/touch-interactions.css">
    <link rel="stylesheet" href="css/loading-states.css?v=20260809-23">
    <script src="js/loading-states.js?v=20260809-23" defer></script>
    <script src="js/touch-interactions.js" defer></script>
</head>

<body>

    <div class="admin-dashboard" id="admin-dashboard" hidden>

    <nav class="admin-nav" aria-label="Admin navigation">
        <a class="admin-nav-brand" href="admin.html">MPWR</a>
        <span class="admin-nav-section">Admin</span>

        <div class="admin-account">
            <button class="admin-account-button" id="admin-account-button" type="button" aria-label="Admin account" aria-expanded="false">
                <img class="admin-account-photo" id="admin-account-photo" alt="">
                <span class="admin-account-initials" id="admin-account-initials" aria-hidden="true"></span>
            </button>
            <div class="admin-account-menu" id="admin-account-menu" hidden>
                <p class="admin-account-label">Administrator</p>
                <p class="admin-account-email" id="admin-account-email"></p>
                <a class="admin-view-profile" href="admin-profile.html">View Profile</a>
                <button type="button" id="admin-signout">Sign Out</button>
            </div>
        </div>
    </nav>

    <header class="admin-header">
        <h1>Dashboard</h1>
        <div class="dashboard-stats">

    <div class="stat-card">
        <h3>Total Orders</h3>
        <p id="total-orders">...</p>
    </div>

    <div class="stat-card">
        <h3>Pending Orders</h3>
        <p id="pending-orders">...</p>
    </div>

    <div class="stat-card">
        <h3>Total Revenue</h3>
        <p id="total-revenue">Loading...</p>
    </div>

    <div class="stat-card">
        <h3>Total Customers</h3>
        <p id="total-customers">...</p>
    </div>

</div>
    </header>

    <main class="admin-container">

        <h2>Orders</h2>

<div class="admin-toolbar">

    <input
        type="text"
        id="order-search"
        placeholder="Search by Order ID or Customer..."
    >

    <div class="status-filters">

        <button class="filter-btn active" data-status="All">All</button>

        <button class="filter-btn" data-status="Pending">Pending</button>

        <button class="filter-btn" data-status="Processing">Processing</button>

        <button class="filter-btn" data-status="Shipped">Shipped</button>

        <button class="filter-btn" data-status="Delivered">Delivered</button>

        <button class="filter-btn" data-status="Cancelled">Cancelled</button>

    </div>

</div>

        <div class="orders-list">
            <!-- Orders will appear here -->
        </div>

        <div class="admin-status-confirm" id="admin-status-confirm" hidden>
            <div class="admin-status-confirm-box" role="dialog" aria-modal="true" aria-labelledby="admin-status-confirm-title">
                <h2 id="admin-status-confirm-title">Update Order Status?</h2>
                <p>Are you sure you want to update this order to <strong id="admin-status-confirm-name"></strong>?</p>
                <div class="admin-status-confirm-actions">
                    <button type="button" class="admin-status-cancel">Cancel</button>
                    <button type="button" class="admin-status-approve">Update Status</button>
                </div>
            </div>
        </div>

        <div id="admin-toast"></div>

    </main>

    </div>

    <script type="module" src="js/products.js"></script>
    <script type="module" src="js/admin.js?v=20260827-1"></script>
    <script src="js/signout-confirm.js"></script>

</body>
</html>
