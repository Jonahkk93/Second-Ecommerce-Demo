<!DOCTYPE html>
<html lang="en" class="site-loading-enabled">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>My Orders</title>

    <link rel="stylesheet" href="css/orders.css">
    <link rel="stylesheet" href="css/signout-confirm.css">

    <link rel="stylesheet" href="css/Larke.css">

    <link rel="stylesheet" href="css/touch-interactions.css">
    <link rel="stylesheet" href="css/loading-states.css?v=20260809-22">
    <script src="js/loading-states.js?v=20260809-22" defer></script>
    <script src="js/touch-interactions.js" defer></script>
</head>

<body>

    <header class="orders-header">

        <a href="Account.html" class="orders-back" aria-label="Back to profile"></a>

        <a href="index.html" class="orders-logo">MPWR</a>

        <button class="orders-signout" type="button" hidden>Sign out</button>

    </header>

    <main class="orders-container">

        <div class="orders-page-title">My Orders</div>

        <div class="orders-content">

        </div>

    </main>

    <div class="orders-confirm-overlay" id="orders-cancel-confirm" aria-hidden="true">
        <div class="orders-confirm-box" role="dialog" aria-modal="true" aria-labelledby="orders-confirm-title">
            <h2 id="orders-confirm-title">Confirm Action</h2>
            <p id="orders-confirm-message"></p>
            <div class="orders-confirm-actions">
                <button class="orders-confirm-dismiss" type="button">Keep Order</button>
                <button class="orders-confirm-approve" type="button">Cancel Order</button>
            </div>
        </div>
    </div>

    <div class="orders-toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/firebase.js"></script>

    <script src="js/products.js"></script>

    <script type="module" src="js/orders.js"></script>
    <script src="js/signout-confirm.js"></script>

</body>

</html>
