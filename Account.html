<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Account | MPWR</title>
    <link rel="stylesheet" href="css/Larke.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/signout-confirm.css">
    <link rel="stylesheet" href="css/touch-interactions.css">
    <link rel="stylesheet" href="css/loading-states.css?v=20260809-1">
    <script src="js/loading-states.js?v=20260809-1"></script>
    <script src="js/touch-interactions.js" defer></script>
</head>
<body>
    <header class="account-page-header">
        <a href="index.html" class="account-back" aria-label="Back to shopping"></a>
        <a href="index.html" class="account-logo">MPWR</a>
        <button class="account-signout" type="button" hidden>Sign out</button>
    </header>

    <main class="account-page">
        <section class="account-profile-overview" hidden>
            <div class="account-profile-picture">
                <img id="account-profile-picture" alt="Profile picture">
                <h2 id="account-profile-name">MPWR Customer</h2>
            </div>

            <a class="account-profile-link" href="personal-information.html">
                <span>Personal Information</span>
                <span aria-hidden="true">›</span>
            </a>

            <a class="account-order-status-link" href="orders.html">
                <span>Order Status</span>
                <span aria-hidden="true">›</span>
            </a>

            <a class="account-profile-link" href="purchases.html">
                <span>My Purchases</span>
                <span aria-hidden="true">›</span>
            </a>
        </section>

        <div class="account-loading">Loading your account…</div>
    </main>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/account-profile.js"></script>
    <script src="js/signout-confirm.js"></script>
</body>
</html>
